<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #0a0f1e;
            color: #fff;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 20px; color: #6366f1; }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid;
        }
        .status.info { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; color: #60a5fa; }
        .status.success { background: rgba(34, 197, 94, 0.1); border-color: #22c55e; color: #4ade80; }
        .status.error { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #f87171; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #9ca3af;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        textarea { min-height: 100px; resize: vertical; }
        button {
            background: #6366f1;
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background: #4f46e5; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .debug {
            margin-top: 30px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
        }
        .debug h3 { margin-bottom: 10px; color: #22d3ee; }
        .debug pre { 
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Contact Form Test</h1>
        
        <div id="configStatus" class="status info">
            Checking configuration...
        </div>

        <form id="testForm">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" value="Test User" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" value="test@example.com" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subject" value="Test Submission" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="message" required>This is a test message to verify the contact form is working correctly.</textarea>
            </div>
            <button type="submit" id="submitBtn">🚀 Test Submit</button>
        </form>

        <div class="debug">
            <h3>📊 Debug Information</h3>
            <div id="debugInfo"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wlwkwwlbyzhuqhrtyhav.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indsd2t3d2xieXpodXFocnR5aGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3Mzg3OTksImV4cCI6MjEwNzMxNDc5OX0.L8r9wfv7PEcVkDZUrjb9H8g4jHofvqji1xx3W7Rwrw8';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        const configStatus = document.getElementById('configStatus');
        const debugInfo = document.getElementById('debugInfo');
        const form = document.getElementById('testForm');
        const submitBtn = document.getElementById('submitBtn');

        function log(message, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('pre');
            logEntry.textContent = `[${timestamp}] ${message}`;
            if (data) {
                logEntry.textContent += '\n' + JSON.stringify(data, null, 2);
            }
            debugInfo.appendChild(logEntry);
        }

        // Check configuration
        async function checkConfig() {
            log('Checking Supabase configuration...');
            
            try {
                // Test connection by checking if we can access the table
                const { data, error } = await supabaseClient
                    .from('contact_submissions')
                    .select('count', { count: 'exact', head: true });

                if (error) {
                    configStatus.className = 'status error';
                    configStatus.innerHTML = `
                        <strong>❌ Configuration Error</strong><br>
                        ${error.message}<br><br>
                        <strong>Possible causes:</strong><br>
                        • Table 'contact_submissions' doesn't exist<br>
                        • RLS policy blocks anonymous access<br>
                        • Project is paused
                    `;
                    log('Configuration check failed:', error);
                } else {
                    configStatus.className = 'status success';
                    configStatus.innerHTML = `
                        <strong>✅ Configuration OK</strong><br>
                        Connected to Supabase successfully!<br>
                        Table exists and is accessible.
                    `;
                    log('Configuration check successful');
                }
            } catch (error) {
                configStatus.className = 'status error';
                configStatus.innerHTML = `
                    <strong>❌ Connection Error</strong><br>
                    ${error.message}<br><br>
                    Check your internet connection.
                `;
                log('Connection error:', error);
            }
        }

        // Submit form
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Submitting...';
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            log('Submitting form data:', formData);

            try {
                const { data, error } = await supabaseClient
                    .from('contact_submissions')
                    .insert([formData])
                    .select()
                    .single();

                if (error) {
                    configStatus.className = 'status error';
                    configStatus.innerHTML = `
                        <strong>❌ Submission Failed</strong><br>
                        ${error.message}<br><br>
                        Error code: ${error.code || 'N/A'}<br>
                        Details: ${error.details || 'N/A'}
                    `;
                    log('Submission error:', error);
                } else {
                    configStatus.className = 'status success';
                    configStatus.innerHTML = `
                        <strong>🎉 SUCCESS!</strong><br>
                        Message submitted successfully!<br>
                        Record ID: ${data.id}<br><br>
                        <strong>Next steps:</strong><br>
                        1. Go to Supabase Dashboard<br>
                        2. Open Table Editor<br>
                        3. View contact_submissions table<br>
                        4. You'll see this test message!
                    `;
                    log('Submission successful:', data);
                    form.reset();
                }
            } catch (error) {
                configStatus.className = 'status error';
                configStatus.innerHTML = `
                    <strong>❌ Unexpected Error</strong><br>
                    ${error.message}
                `;
                log('Unexpected error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Test Submit';
            }
        });

        // Check config on load
        checkConfig();
    </script>
</body>
</html>
