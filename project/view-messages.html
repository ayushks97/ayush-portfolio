<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Messages - Admin View</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0f1e;
            color: #e5e7eb;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #6366f1 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #6366f1;
        }
        .stat-label {
            color: #9ca3af;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #6366f1;
            border-color: #6366f1;
        }
        .message-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .message-card:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }
        .message-card.unread {
            border-left: 4px solid #22d3ee;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .message-info h3 {
            color: #fff;
            margin-bottom: 5px;
        }
        .message-info p {
            color: #9ca3af;
            font-size: 0.9em;
        }
        .message-meta {
            text-align: right;
            font-size: 0.85em;
            color: #9ca3af;
        }
        .message-subject {
            color: #22d3ee;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .message-content {
            color: #d1d5db;
            line-height: 1.6;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
            margin-top: 5px;
        }
        .badge.unread {
            background: #22d3ee;
            color: #000;
        }
        .badge.read {
            background: rgba(255,255,255,0.1);
            color: #9ca3af;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
        }
        .btn-mark-read {
            background: #22d3ee;
            color: #000;
        }
        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Contact Form Messages</h1>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">-</div>
                <div class="stat-label">Total Messages</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="unreadCount">-</div>
                <div class="stat-label">Unread</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayCount">-</div>
                <div class="stat-label">Today</div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterMessages('all')">All</button>
            <button class="filter-btn" onclick="filterMessages('unread')">Unread</button>
            <button class="filter-btn" onclick="filterMessages('read')">Read</button>
            <button class="filter-btn" onclick="loadMessages()">🔄 Refresh</button>
        </div>

        <div id="messages"></div>
    </div>

    <script>
        // ⚠️ IMPORTANT: Add your Supabase credentials here
        const SUPABASE_URL = 'https://wlwkwwlbyzhuqhrtyhav.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY_HERE'; // ⚠️ Replace this!

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allMessages = [];
        let currentFilter = 'all';

        async function loadMessages() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div class="loading">Loading messages...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('contact_submissions')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allMessages = data || [];
                updateStats();
                displayMessages();
            } catch (error) {
                messagesDiv.innerHTML = `
                    <div class="error">
                        <strong>Error loading messages:</strong><br>
                        ${error.message}<br><br>
                        <strong>Possible reasons:</strong><br>
                        • Wrong API key in this file<br>
                        • Supabase project is paused<br>
                        • RLS policy blocks SELECT<br><br>
                        <em>Check browser console for details</em>
                    </div>
                `;
                console.error('Error:', error);
            }
        }

        function updateStats() {
            const total = allMessages.length;
            const unread = allMessages.filter(m => !m.read).length;
            const today = allMessages.filter(m => {
                const msgDate = new Date(m.created_at).toDateString();
                const todayDate = new Date().toDateString();
                return msgDate === todayDate;
            }).length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('unreadCount').textContent = unread;
            document.getElementById('todayCount').textContent = today;
        }

        function displayMessages() {
            let filteredMessages = allMessages;

            if (currentFilter === 'unread') {
                filteredMessages = allMessages.filter(m => !m.read);
            } else if (currentFilter === 'read') {
                filteredMessages = allMessages.filter(m => m.read);
            }

            const messagesDiv = document.getElementById('messages');

            if (filteredMessages.length === 0) {
                messagesDiv.innerHTML = '<div class="empty">📭 No messages found</div>';
                return;
            }

            messagesDiv.innerHTML = filteredMessages.map(msg => `
                <div class="message-card ${msg.read ? '' : 'unread'}">
                    <div class="message-header">
                        <div class="message-info">
                            <h3>${escapeHtml(msg.name)}</h3>
                            <p>${escapeHtml(msg.email)}</p>
                        </div>
                        <div class="message-meta">
                            ${formatDate(msg.created_at)}
                            <br>
                            <span class="badge ${msg.read ? 'read' : 'unread'}">
                                ${msg.read ? 'Read' : 'Unread'}
                            </span>
                        </div>
                    </div>
                    <div class="message-subject">
                        📋 ${escapeHtml(msg.subject)}
                    </div>
                    <div class="message-content">
                        ${escapeHtml(msg.message)}
                    </div>
                </div>
            `).join('');
        }

        function filterMessages(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            displayMessages();
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const hours = Math.floor(diff / 3600000);
            
            if (hours < 1) return 'Just now';
            if (hours < 24) return `${hours}h ago`;
            
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined,
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load messages on page load
        loadMessages();

        // Auto-refresh every 30 seconds
        setInterval(loadMessages, 30000);
    </script>
</body>
</html>
